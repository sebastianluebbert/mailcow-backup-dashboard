name: Quality

on:
  push:
    branches: ["main", "cursor/**"]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: python -m pip install -r server/requirements-dev.txt

      - name: Validate Python
        run: python -m compileall -q server tests

      - name: Validate JavaScript
        run: node --check server/static/app.js

      - name: Validate shell scripts
        run: |
          bash -n agent/lib/common.sh agent/mailcow-backup.sh agent/mailcow-verify.sh \
            agent/mailcow-watchdog.sh agent/install-agent.sh server/install-server.sh update.sh

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Run shellcheck
        run: |
          shellcheck -S warning agent/lib/common.sh agent/mailcow-backup.sh agent/mailcow-verify.sh \
            agent/mailcow-watchdog.sh agent/install-agent.sh server/install-server.sh update.sh

      - name: Run UI contract tests
        run: python -m unittest discover -s tests -v
